name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (CPU torch + triton)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install triton

      - name: Syntax check (compile all sources)
        run: python -m compileall -q agent benchmarks scripts

      - name: Run unit tests (core + agent, no GPU needed)
        run: python scripts/run_all_tests.py --ci

      # 说明：真实 GPU 沙箱/内核数值测试（executor / smoke / bench）需要 NVIDIA GPU，
      # GitHub Actions 免费 runner 无 GPU，故本仓库把它们保留为本地 triton_env 手动运行
      # （见 README「快速开始」）。
